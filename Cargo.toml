[package]
name = "brunson"
version = "0.1.1"
edition = "2021"
description = "Terminal PR manager with daemon/TUI split"
license = "MIT"
repository = "https://github.com/austinlparker/brunson"
homepage = "https://github.com/austinlparker/brunson"
readme = "README.md"
keywords = ["cli", "github", "pull-requests", "tui"]
categories = ["command-line-utilities"]
# MSRV has not been empirically lowered; this matches the current stable toolchain.
rust-version = "1.96"

[lib]
name = "brunson"
path = "src/lib.rs"

[[bin]]
name = "brunson"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
similar = "2"
syntect = "5"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"
textwrap = "0.16"
unicode-width = "0.1"
open = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
